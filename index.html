const DEFAULT_ROTATION_ASSIGNMENT_UNIT_SEQUENCE = ['A1', 'B1', 'C1', 'A2', 'B2', 'C2', 'A3', 'B3', 'C3', 'A4', 'B4', 'C4'];

const buildRotationSequence = (startPos = 1) => {
    const idx = ROTATION_BASE_SEQUENCE.indexOf(Number(startPos));

const getRotationBlockContent = (step) => {
    const groupOffset = step % 3;

        ROTATION_GROUPS[(0 + groupOffset) % 3],

const MESES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
const AUTO_A_PROFILE_SEGMENTS = [
    { key: 'multAInvierno', label: 'Invierno / cierre', months: [0, 11], defaultValue: 3 },
    { key: 'multABaja', label: 'Meses bajos', months: [1, 9, 10], defaultValue: 1 },

const roundToOneDecimal = (value) => Math.round((Number(value) || 0) * 10) / 10;
const getAutoAProfileSegmentForMonth = (monthIdx) => AUTO_A_PROFILE_SEGMENTS.find(segment => segment.months.includes(monthIdx)) || AUTO_A_PROFILE_SEGMENTS[1];
const getLegacyMonthlyMultiplierA = (cfg, monthIdx) => {
    const legacyValue = Number(cfg?.[`multA_${monthIdx}`]);
    return Number.isFinite(legacyValue) && legacyValue > 0 ? legacyValue : null;
};
const getAutoPriorityMultiplierA = (cfg, monthIdx) => {
    const segment = getAutoAProfileSegmentForMonth(monthIdx);
    const profileValue = Number(cfg?.[segment.key]);
    if (Number.isFinite(profileValue) && profileValue > 0) return profileValue;
    const legacyValue = getLegacyMonthlyMultiplierA(cfg, monthIdx);
    if (legacyValue != null) return legacyValue;
    return segment.defaultValue;
};
const normalizeOrderedSequence = (sequence, allowedValues) => {
    const allowed = Array.isArray(allowedValues) ? allowedValues : [];
    const incoming = Array.isArray(sequence) ? sequence : [];
    const unique = [];
    incoming.forEach(value => {
        if (!allowed.includes(value) || unique.includes(value)) return;
        unique.push(value);
    });
    allowed.forEach(value => {
        if (!unique.includes(value)) unique.push(value);
    });
    return unique.slice(0, allowed.length);
};
const normalizeRotationBlockFillSequence = (sequence) => normalizeOrderedSequence(sequence, DEFAULT_ROTATION_BLOCK_FILL_SEQUENCE);
const normalizeRotationSubblockFillSequence = (sequence) => normalizeOrderedSequence(sequence, DEFAULT_ROTATION_SUBBLOCK_FILL_SEQUENCE);
const normalizeRotationSubsubblockFillSequence = (sequence) => normalizeOrderedSequence(sequence, DEFAULT_ROTATION_SUBSUBBLOCK_FILL_SEQUENCE);
const normalizeRotationFillPriority = (priority) => normalizeOrderedSequence(priority, DEFAULT_ROTATION_FILL_PRIORITY);
const getRotationFillDimensionLabel = (key) => ROTATION_FILL_DIMENSION_LABELS[key] || key;
const normalizeAutoAMultipliers = (cfg = {}) => {
    const next = { ...cfg };
    AUTO_A_PROFILE_SEGMENTS.forEach(segment => {
        const currentValue = Number(next[segment.key]);
        if (Number.isFinite(currentValue) && currentValue > 0) {
            next[segment.key] = roundToOneDecimal(currentValue);
            return;
        }
        const legacyValues = segment.months.map(monthIdx => getLegacyMonthlyMultiplierA(next, monthIdx)).filter(v => v != null);
        const fallback = legacyValues.length > 0 ? (legacyValues.reduce((sum, value) => sum + value, 0) / legacyValues.length) : segment.defaultValue;
        next[segment.key] = roundToOneDecimal(fallback);
    });
    for (let monthIdx = 0; monthIdx < 12; monthIdx++) {
        next[`multA_${monthIdx}`] = roundToOneDecimal(getAutoPriorityMultiplierA(next, monthIdx));
    }
    next.rotationBlockFillSequence = normalizeRotationBlockFillSequence(next.rotationBlockFillSequence);
    next.rotationSubblockFillSequence = normalizeRotationSubblockFillSequence(
        next.rotationSubblockFillSequence ?? deriveRotationSubblockFillSequence(next.rotationUnitSequence)
    );
    next.rotationSubsubblockFillSequence = normalizeRotationSubsubblockFillSequence(
        next.rotationSubsubblockFillSequence ?? deriveRotationSubsubblockFillSequence(next.rotationUnitSequence)
    );
    next.rotationFillPriority = normalizeRotationFillPriority(next.rotationFillPriority);
    next.rotationUnitSequence = buildRotationUnitSequence(
        next.rotationSubblockFillSequence,
        next.rotationSubsubblockFillSequence,
        next.rotationFillPriority

    return next;
};
const normalizeRotationUnitSequence = (sequence) => {
    const incoming = Array.isArray(sequence) ? sequence : [];
    const valid = incoming.filter(unit => ALL_ROTATION_UNITS.includes(unit));
    const unique = [];
    valid.forEach(unit => {
        if (!unique.includes(unit)) unique.push(unit);
    });
    DEFAULT_ROTATION_ASSIGNMENT_UNIT_SEQUENCE.forEach(unit => {
        if (!unique.includes(unit)) unique.push(unit);
    });
    return unique.slice(0, ALL_ROTATION_UNITS.length);
};
const deriveRotationSubblockFillSequence = (sequence) => {
    const units = normalizeRotationUnitSequence(sequence);

};
const deriveRotationSubsubblockFillSequence = (sequence) => {
    const units = normalizeRotationUnitSequence(sequence);

};
const buildRotationUnitSequence = (
    groupSequence = DEFAULT_ROTATION_SUBBLOCK_FILL_SEQUENCE,
    subSequence = DEFAULT_ROTATION_SUBSUBBLOCK_FILL_SEQUENCE,
    fillPriority = DEFAULT_ROTATION_FILL_PRIORITY
) => {
    const normalizedGroups = normalizeRotationSubblockFillSequence(groupSequence);
    const normalizedSubs = normalizeRotationSubsubblockFillSequence(subSequence);
    const normalizedPriority = normalizeRotationFillPriority(fillPriority);
    const groupPriority = normalizedPriority.indexOf('group');
    const subPriority = normalizedPriority.indexOf('sub');
    const units = [];
    if (groupPriority !== -1 && subPriority !== -1 && groupPriority < subPriority) {
        normalizedSubs.forEach(sub => normalizedGroups.forEach(group => units.push(`${group}${sub}`)));
        return units;
    }
    normalizedGroups.forEach(group => normalizedSubs.forEach(sub => units.push(`${group}${sub}`)));
    return units;
};
const distributeIntegerBuckets = (total, bucketCount) => {
    const safeTotal = Math.max(0, Math.round(Number(total) || 0));
    const safeBuckets = Math.max(1, Math.round(Number(bucketCount) || 1));
    const base = Math.floor(safeTotal / safeBuckets);
    const remainder = safeTotal % safeBuckets;
    return Array.from({ length: safeBuckets }, (_, idx) => base + (idx < remainder ? 1 : 0));
};
const summarizeIntegerDistribution = (values) => {
    const safeValues = Array.isArray(values) ? values : [];
    if (safeValues.length === 0) return '0';
    const unique = [...new Set(safeValues)];
    if (unique.length <= 3) return safeValues.join(' / ');
    const counts = new Map();
    safeValues.forEach(value => counts.set(value, (counts.get(value) || 0) + 1));
    return Array.from(counts.entries())
        .sort((a, b) => Number(b[0]) - Number(a[0]))
        .map(([value, count]) => `${value} x ${count}`)
        .join(', ');
};
const getRotationBlockBreakdown = (totalMte, configuredBlockSize) => {
    const safeTotal = Math.max(0, Number(totalMte) || 0);
    const autoBlockSize = Math.max(1, Math.round((safeTotal || 2100) / 13));
    const explicitBlockSize = Number(configuredBlockSize);
    const blockSize = Number.isFinite(explicitBlockSize) && explicitBlockSize > 0 ? Math.round(explicitBlockSize) : autoBlockSize;
    const subbloques = distributeIntegerBuckets(blockSize, 3);
    const subsubbloques = distributeIntegerBuckets(blockSize, 12);
    return {
        bloque: blockSize,
        subbloques,
        subsubbloques,
        subbloque: summarizeIntegerDistribution(subbloques),
        subsubbloque: summarizeIntegerDistribution(subsubbloques),
        autoBloque: autoBlockSize
    };
};
const extractRotationDneListFromWorkbookData = (arrayBuffer) => {
    if (typeof XLSX === 'undefined') throw new Error('xlsx');
    const data = new Uint8Array(arrayBuffer);
    const workbook = XLSX.read(data, { type: 'array' });
    const sheetName = workbook.SheetNames[0];
    if (!sheetName) throw new Error('sheet');
    const sheet = workbook.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });

};

    ...prevConfig,

    rotationBlockSize: Math.round(dneList.length / 13),
    rotationDneList: dneList,
    rotationDneFileName: fileName

const buildRotationAssignmentSlots = (totalMte, unitSequence = DEFAULT_ROTATION_ASSIGNMENT_UNIT_SEQUENCE) => {
    const normalizedTotal = Math.max(0, Number(totalMte) || 0);
    const slots = [];
    if (normalizedTotal <= 0) return slots;
    const normalizedSequence = normalizeRotationUnitSequence(unitSequence);
    const seatsPerUnit = Math.ceil(normalizedTotal / (13 * normalizedSequence.length));
    for (let seat = 1; seat <= seatsPerUnit; seat++) {
        for (const unit of normalizedSequence) {
            for (let block = 1; block <= 13; block++) {
                slots.push({
                    block,
                    unit,
                    seat,
                    label: `Bloque ${block} · ${unit} · Puesto ${seat}`

            }

};
const buildRotationAssignmentSlotsByFillOrder = (
    totalMte,
    {
        unitSequence = DEFAULT_ROTATION_ASSIGNMENT_UNIT_SEQUENCE,
        blockSequence = DEFAULT_ROTATION_BLOCK_FILL_SEQUENCE,
        groupSequence = DEFAULT_ROTATION_SUBBLOCK_FILL_SEQUENCE,
        subSequence = DEFAULT_ROTATION_SUBSUBBLOCK_FILL_SEQUENCE,
        fillPriority = DEFAULT_ROTATION_FILL_PRIORITY
    } = {}
) => {
    const normalizedTotal = Math.max(0, Number(totalMte) || 0);
    const slots = [];
    if (normalizedTotal <= 0) return slots;
    const normalizedSequence = normalizeRotationUnitSequence(unitSequence);
    const normalizedBlocks = normalizeRotationBlockFillSequence(blockSequence);
    const normalizedGroups = normalizeRotationSubblockFillSequence(groupSequence);
    const normalizedSubs = normalizeRotationSubsubblockFillSequence(subSequence);
    const normalizedPriority = normalizeRotationFillPriority(fillPriority);
    const seatsPerUnit = Math.ceil(normalizedTotal / (13 * normalizedSequence.length));
    const dimensionValues = {
        block: normalizedBlocks,
        group: normalizedGroups,
        sub: normalizedSubs
    };
    const iterateFillOrder = (visitor) => {
        const walk = (priorityIndex, state) => {
            if (priorityIndex < 0) {
                visitor(state);
                return;
            }
            const key = normalizedPriority[priorityIndex];
            const values = dimensionValues[key] || [];
            values.forEach(value => {
                walk(priorityIndex - 1, { ...state, [key]: value });
            });
        };
        walk(normalizedPriority.length - 1, {});
    };
    for (let seat = 1; seat <= seatsPerUnit; seat++) {
        iterateFillOrder(({ block, group, sub }) => {
            const unit = `${group}${sub}`;
            if (!normalizedSequence.includes(unit)) return;
            slots.push({
                block,
                unit,
                seat,
                label: `Bloque ${block} Â· ${unit} Â· Puesto ${seat}`

    }

};

            const next = [...current];

            next[toIdx] = tmp;
            return { ...prev, [configKey]: next };
        });

const getEasterDate = (year) => {
    const a = year % 19;
    const b = Math.floor(year / 100);
    const c = year % 100;
    const d = Math.floor(b / 4);
    const e = b % 4;
    const f = Math.floor((b + 8) / 25);
    const g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4);
    const k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const month = Math.floor((h + l - 7 * m + 114) / 31) - 1;
    const day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(year, month, day);
};

const posMod = (n, m) => ((n % m) + m) % m;

const buildFestivosSetForYear = (year, customHolidays = []) => {
    const fixed = ["0-1", "0-6", "4-1", "4-2", "4-15", "7-15", "9-12", "10-1", "10-9", "11-6", "11-8", "11-25"];
    const easter = getEasterDate(year);
    const juevesSanto = new Date(easter);
    juevesSanto.setDate(easter.getDate() - 3);
    const viernesSanto = new Date(easter);
    viernesSanto.setDate(easter.getDate() - 2);
    const all = [...fixed, `${juevesSanto.getMonth()}-${juevesSanto.getDate()}`, `${viernesSanto.getMonth()}-${viernesSanto.getDate()}`, ...(customHolidays || [])];
    return new Set(all);
};

const isBaseRestForGroup = (date, groupShift) => {
    const dow = date.getDay();
    const diff = dow === 0 ? 6 : dow - 1;
    const mon = new Date(date);
    mon.setDate(date.getDate() - diff);
    mon.setHours(0, 0, 0, 0);
    const wb = Math.round((mon - ANCHOR_MONDAY) / MS_PER_WEEK);
    let si = (wb - groupShift) % 4;
    if (si < 0) si += 4;
    return SEQUENCE[si].includes(dow);
};

const getAdjustedRmDateForScenario = (year, vacationRow, pfaOpt, groupShift, restChecker = isBaseRestForGroup) => {
    const base = getRmDateForScenario(year, vacationRow, pfaOpt);
    if (!base) return null;
    const adjusted = new Date(base);
    adjusted.setHours(0, 0, 0, 0);
    let safety = 0;
    while (restChecker(adjusted, groupShift) && safety < 31) {
        adjusted.setDate(adjusted.getDate() - 1);
        safety++;
    }
    return adjusted;
};

const getAdjustedPfaRangeForScenario = (year, pfaOpt, targetGroupShift) => {
    const originalStart = new Date(year, pfaOpt.start.m, pfaOpt.start.d);
    let actualStart = new Date(originalStart);
    const originalEnd = new Date(year, pfaOpt.end.m, pfaOpt.end.d);
    const durationMs = originalEnd.getTime() - originalStart.getTime();
    const isDecemberPfa11To31 = pfaOpt.start.m === 11 && pfaOpt.start.d === 11;
    let safety = 0;
    while (isBaseRestForGroup(actualStart, targetGroupShift) && safety < 10) {
        actualStart.setDate(actualStart.getDate() + (isDecemberPfa11To31 ? -1 : 1));
        safety++;
    }
    const pfaStart = actualStart.getTime();
    let pfaEnd = pfaStart + durationMs;
    if (isDecemberPfa11To31 && actualStart.getTime() < originalStart.getTime()) {
        pfaEnd = originalEnd.getTime();
    }
    return { pfaStart, pfaEnd };
};

const getVacationRangesForScenario = (year, vacationRow, pfaOpt, groupShift) => {
    const summerStart = new Date(year, vacationRow.summer.start.m, vacationRow.summer.start.d).getTime();
    const summerEnd = new Date(year, vacationRow.summer.end.m, vacationRow.summer.end.d).getTime();
    const pfaRange = getAdjustedPfaRangeForScenario(year, pfaOpt, groupShift);
    return { summerStart, summerEnd, pfaStart: pfaRange.pfaStart, pfaEnd: pfaRange.pfaEnd };
};

const isVacationForScenario = (date, ranges) => {
    const t = date.getTime();
    return (t >= ranges.summerStart && t <= ranges.summerEnd) || (t >= ranges.pfaStart && t <= ranges.pfaEnd);
};

const buildRedDaysSetBForScenario = (year, groupShift, subGroupIdx) => {
    const reds = new Set();
    const firstDayOfYear = new Date(year, 0, 1);
    const daysToFirstMonday = firstDayOfYear.getDay() === 1 ? 0 : (firstDayOfYear.getDay() === 0 ? 1 : 8 - firstDayOfYear.getDay());
    const firstMonday = new Date(year, 0, 1 + daysToFirstMonday);
    firstMonday.setHours(0, 0, 0, 0);

    for (let w = -4; w <= 56; w++) {
        const currentMonday = new Date(firstMonday);
        currentMonday.setDate(firstMonday.getDate() + w * 7);
        const weeksBetween = Math.round((currentMonday - ANCHOR_MONDAY) / MS_PER_WEEK);
        const groupWeek = posMod(weeksBetween - groupShift, 24);
        const phase = groupWeek % 4;
        const cycle = Math.floor(groupWeek / 4);
        let daysOffset = [];
        if (phase === 1) {
            daysOffset = (subGroupIdx === posMod(cycle + 1, 6)) ? [0, 1] : ((subGroupIdx === posMod(cycle + 3, 6)) ? [3, 4] : []);
        } else if (phase === 2) {
            daysOffset = (subGroupIdx === posMod(cycle + 5, 6)) ? [2] : [];
        }
        for (const offset of daysOffset) {
            const targetDate = new Date(currentMonday);
            targetDate.setDate(currentMonday.getDate() + offset);
            if (targetDate.getFullYear() === year) {
                reds.add(`${targetDate.getMonth()}-${targetDate.getDate()}`);
            }
        }
    }
    return reds;
};

const buildCyclesForScenarioC = (year, groupShift) => {
    const rawList = [];
    let current = new Date(year, 0, 1);
    current.setDate(current.getDate() + (current.getDay() === 0 ? 1 : (8 - current.getDay()) % 7));
    while (current.getFullYear() <= year) {
        const weeksBetween = Math.round((current - ANCHOR_MONDAY) / MS_PER_WEEK);
        let seqIdx = (weeksBetween - groupShift) % 4;
        if (seqIdx < 0) seqIdx += 4;
        if (seqIdx === 0) {
            const start = new Date(current);
            const end = new Date(current);
            end.setDate(start.getDate() + 14);
            rawList.push({ start, end });
        }
        current.setDate(current.getDate() + 7);
    }
    return rawList;
};

const computeAnnualBalance = ({ year, groupShift, targetDays, vacationRanges, specificRestSet = null, specificCycle = null, workRule = 'classic', includeVacationOnWork = false, rmDate = null, rmInside = false }) => {
    let workDays = 0;
    let baseRests = 0;
    let extraRests = 0;
    let vacPfaDays = 0;
    let vacOnWorkDays = 0;
    const rmDayId = rmDate ? `${rmDate.getMonth()}-${rmDate.getDate()}` : null;
    const start = new Date(year, 0, 1);
    const end = new Date(year, 11, 31);
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
        const dayId = `${d.getMonth()}-${d.getDate()}`;
        const isBase = isBaseRestForGroup(d, groupShift);
        const t = d.getTime();
        const isSpecific = specificRestSet ? specificRestSet.has(dayId) : (specificCycle ? (t >= specificCycle.start.getTime() && t <= specificCycle.end.getTime()) : false);
        const isRmOutside = !rmInside && rmDayId === dayId;
        const isVac = vacationRanges ? isVacationForScenario(d, vacationRanges) : false;
        const isPotentialWork = !isBase && !isSpecific;
        const isVacationOnWorkDay = isPotentialWork && (isVac || isRmOutside);
        if (isVac) vacPfaDays++;
        if (isBase) baseRests++;
        else if (isSpecific) extraRests++;

        if (workRule === 'rest_and_specific_only') {
            if (isPotentialWork) {
                if (isVacationOnWorkDay && includeVacationOnWork) vacOnWorkDays++;
                else if (!isVacationOnWorkDay) workDays++;
            }
        } else if (isPotentialWork && !isVac && !isRmOutside) {
            workDays++;
        }
    }
    const diff = workDays - targetDays;
    return {
        workDays,
        baseRests,
        extraRests,
        vacPfaDays,
        vacOnWorkDays,
        creditDays: diff > 0 ? diff : 0,
        debitDays: diff < 0 ? Math.abs(diff) : 0,
        diff
    };
};

const buildCCRFixedDaysSet = (year, groupShift, vacationRanges, maxDays = 10, rmDate = null, rmInside = false) => {
    const selected = new Set();
    const rmDayId = rmDate ? `${rmDate.getMonth()}-${rmDate.getDate()}` : null;
    const start = new Date(year, 0, 1);
    const end = new Date(year, 11, 31);
    for (let d = new Date(start); d <= end && selected.size < maxDays; d.setDate(d.getDate() + 1)) {
        const isBase = isBaseRestForGroup(d, groupShift);
        const isVac = isVacationForScenario(d, vacationRanges);
        const dayId = `${d.getMonth()}-${d.getDate()}`;
        const isRmRest = rmInside && rmDayId === dayId;
        if (isBase || isVac || isRmRest) continue;
        selected.add(dayId);
    }
    return selected;
};

    };

        setConfig(prev => normalizeAutoAMultipliers({ ...prev, [key]: parsed }));

    };

        const file = e.target.files && e.target.files[0];

            e.target.value = '';
            return;

            try {
                const dneList = extractRotationDneListFromWorkbookData(reader.result);

                showStatus('Error al leer Excel: usa una sola columna con un DNE por fila');

        reader.readAsArrayBuffer(file);

    const moveRotationUnit = (fromIdx, direction) => {
        setConfig(prev => {
            const current = normalizeRotationUnitSequence(prev.rotationUnitSequence);
            const toIdx = fromIdx + direction;
            if (toIdx < 0 || toIdx >= current.length) return prev;
            const nextSeq = [...current];

            nextSeq[fromIdx] = nextSeq[toIdx];
            nextSeq[toIdx] = tmp;
            return normalizeAutoAMultipliers({ ...prev, rotationUnitSequence: nextSeq });

            const a = document.createElement('a');

            a.download = `scmm_ajustes_${stamp}.txt`;

            a.click();

            URL.revokeObjectURL(a.href);
            showStatus("Ajustes exportados");

            showStatus("Error al exportar");
        }
    };

                            next[key] = Number.isFinite(n) ? n : current;

// --- 4. COMPONENTE MES VISUAL (GRID) ---
const Month = React.memo(function Month({ tipo, monthIdx, year, groupShift, redDaysSet, getCupo, getCupoPAP, selectedDays, selectedPAPDays, papModeEnabled, onDayClick, onPapDayClick, isConfirmed, festivos, anchorMonday, sequence, getVacationStatus, getRMStatus, cyclesC, selectedCycleC }) {
    const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
    const firstDayDate = new Date(year, monthIdx, 1);
    const firstDayWeekday = firstDayDate.getDay();
    const firstDayIdx = firstDayWeekday === 0 ? 6 : firstDayWeekday - 1; 
    const festivosSet = useMemo(() => new Set(festivos), [festivos]);
    const selectedDaysSet = useMemo(() => new Set(selectedDays), [selectedDays]);
    const selectedPAPDaysSet = useMemo(() => new Set(selectedPAPDays), [selectedPAPDays]);
    const effectivePapMode = tipo === 'C' ? true : papModeEnabled;
    const days = [];

    for (let d = 1; d <= daysInMonth; d++) {
        const current = new Date(year, monthIdx, d);
        const dayOfWeek = current.getDay();
        const esSD = (dayOfWeek === 0 || dayOfWeek === 6);
        const dayId = `${monthIdx}-${d}`;
        const esF = festivosSet.has(dayId);
        
        const diffToMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
        const currentMonday = new Date(current); currentMonday.setDate(current.getDate() - diffToMonday); currentMonday.setHours(0,0,0,0);
        const weeksBetween = Math.round((currentMonday - anchorMonday) / MS_PER_WEEK);
        let seqIdx = (weeksBetween - groupShift) % 4; if (seqIdx < 0) seqIdx += 4;
        
        const isDescansoA = sequence[seqIdx].includes(dayOfWeek);
        const isDescansoB = tipo === 'B' && redDaysSet.has(dayId);
        const currentCycle = tipo === 'C' ? cyclesC.find(c => current >= c.start && current <= c.end) : null;
        const isCCRBase = tipo === 'C' ? (seqIdx === 0 || seqIdx === 1 || (seqIdx === 2 && dayOfWeek === 1)) : false;
        const { isSummer, isPfa } = getVacationStatus(current);
        const { isRMDay, isRMInside } = getRMStatus ? getRMStatus(current) : { isRMDay: false, isRMInside: false };
        const isVacation = isSummer || isPfa;
        
        const cupo = getCupo(monthIdx, d, esSD, esF);
        const isSelectedA = tipo === 'A' && selectedDaysSet.has(dayId);
        const isSelectedC = tipo === 'C' && selectedCycleC && (current >= selectedCycleC.start && current <= selectedCycleC.end);
        const isSelectedPAP = selectedPAPDaysSet.has(dayId);
        const papCupoBase = getCupoPAP ? getCupoPAP(monthIdx, d, dayOfWeek) : 0;
        const papCupo = Math.max(0, papCupoBase - (isSelectedPAP ? 1 : 0));
        const papBlocked = isDescansoA || isDescansoB || isVacation || isSelectedA || isSelectedC || (isRMDay && isRMInside);

        let baseClass = "cell-base";
        if (tipo === 'C') {
            if (isSelectedC) baseClass += " ccr-selected";
            else if (isDescansoA) baseClass += " descanso-yellow";
            else if (isCCRBase && currentCycle) {
                baseClass += currentCycle.isIncompatible ? " bg-red-50 text-red-300" : ` ccr-${currentCycle.availabilityLevel}`;
            }
        } else {
            if (isDescansoB) baseClass += " descanso-red";
            else if (isDescansoA) baseClass += " descanso-yellow";
            else if (isSelectedA) baseClass += isConfirmed ? " sel-confirmed" : " sel-selected";
            else if (cupo === 0 && tipo === 'A') baseClass += " bg-red-50"; 
        }
        if (isRMDay && isRMInside) baseClass += " rm-day-inside";
        else if (isRMDay && !isRMInside) baseClass += " rm-day-outside";
        if (isSelectedPAP && !isSelectedC) baseClass += " pap-selected";

        let isOpacity60 = false;
        if (isVacation && !isSelectedA && !isSelectedC) isOpacity60 = true;
        if (tipo === 'A' && cupo === 0 && !isSelectedA && !isDescansoA && !isDescansoB) isOpacity60 = true;
        if (isRMDay && isRMInside && !isSelectedA && !isSelectedC) isOpacity60 = true;

        let badgeClass = cupo === 0 ? "cupo-empty" : (cupo <= 5 ? "cupo-low" : "cupo-ok");
        let papBadgeClass = papCupo === 0 ? "cupo-empty" : (papCupo <= 10 ? "cupo-low" : "cupo-ok");

        days.push({ d, dayId, dayOfWeek, isDescansoA, isDescansoB, isVacation, isSummer, isPfa, isRMDay, isRMInside, cupo, badgeClass, papCupoBase, papCupo, papBadgeClass, papBlocked, baseClass, isSelectedA, isOpacity60, esF, esSD });
    }

    return (
        <div className="bg-white/50 rounded-lg border border-white/60 p-2 md:p-3 shadow-sm flex flex-col min-h-[260px] relative z-10 backdrop-blur-md">
            <h3 className="text-[#2563eb] font-bold text-center text-xs md:text-sm capitalize mb-2 pb-1 border-b border-gray-100/50">{MESES[monthIdx]}</h3>
            <div className="grid grid-cols-7 gap-px text-center text-[10px] md:text-xs font-bold text-gray-500 mb-1">{['L','M','X','J','V','S','D'].map(d => <div key={d}>{d}</div>)}</div>
            <div className="grid grid-cols-7 grid-rows-6 gap-[1px] flex-1">
                {Array(firstDayIdx).fill(0).map((_, i) => <div key={`b-${i}`}></div>)}
                {days.map((day) => (
                    <div key={day.d} onClick={() => {
                        if (effectivePapMode) {
                            onPapDayClick(monthIdx, day.d, day.dayOfWeek, day.papBlocked, day.papCupoBase);
                            return;
                        }
                        if (tipo === 'B' || tipo === 'C' || day.isDescansoA || day.isDescansoB || (day.isVacation && !day.isSelectedA) || (day.isRMDay && day.isRMInside)) return; 
                        if (day.cupo > 0 || day.isSelectedA) onDayClick(monthIdx, day.d, day.esSD, day.esF, day.isDescansoA || day.isDescansoB, day.isVacation, day.isRMDay && day.isRMInside);
                    }} className={`${day.baseClass} ${day.isOpacity60 ? 'cursor-not-allowed opacity-60' : ''}`}>
                        <span className={`text-[11px] md:text-xs leading-none flex items-center justify-center ${day.esF || day.esSD ? 'text-red-500 font-bold' : (day.isDescansoB ? 'text-red-800 font-bold' : 'text-gray-800')}`}>
                            {day.d}{day.isSummer && <span className="icon-overlay">☀️</span>}{day.isPfa && <span className="icon-overlay">❄️</span>}{day.isRMDay && !day.isRMInside && <span className="icon-overlay">🩺</span>}
                        </span>
                        {effectivePapMode ? (
                            <div className={`cupo-badge ${day.papBadgeClass}`}>{day.papCupo}</div>
                        ) : (
                            tipo === 'A' && <div className={`cupo-badge ${day.badgeClass}`}>{day.cupo}</div>
                        )}
                    </div>
                ))}
            </div>
        </div>
    );
});

const SimuladorEngine = React.memo(function SimuladorEngine({ tipo, config, setConfig, onBack, onGoAnalysis, initialScenario, onInitialScenarioApplied }) {
    const [year, setYear] = useState(2027);
    const [block, setBlock] = useState(1);
    const [subBlockIdx, setSubBlockIdx] = useState(0);
    const [groupShift, setGroupShift] = useState(0); 
    const [subGroupIdx, setSubGroupIdx] = useState(0); 
    const [enableVacations, setEnableVacations] = useState(false);
    const [vacationRowId, setVacationRowId] = useState("");
    const [pfaIdx, setPfaIdx] = useState(0);
    const [rmStatus, setRmStatus] = useState("fuera");
    const [creditsEnabled, setCreditsEnabled] = useState(true);
    const [maxCredits, setMaxCredits] = useState(DEFAULT_FLEX_DAYS_A);
    const [selectedDays, setSelectedDays] = useState([]);
    const [selectedPAPDays, setSelectedPAPDays] = useState([]);
    const [papModeEnabled, setPapModeEnabled] = useState(false);
    const [isConfirmed, setIsConfirmed] = useState(false);
    const [selectedCycleC, setSelectedCycleC] = useState(null);
    const [showLogica, setShowLogica] = useState(false);
    const [showHelp, setShowHelp] = useState(false);
    const appliedScenarioTokenRef = useRef(null);

    useEffect(() => {
        if (!initialScenario || initialScenario.tipo !== tipo) return;
        if (appliedScenarioTokenRef.current === initialScenario.token) return;

        const safeYear = Number(initialScenario.year);
        if (Number.isFinite(safeYear)) setYear(safeYear);

        const safeGroupShift = Number(initialScenario.groupShift);
        if (Number.isFinite(safeGroupShift) && safeGroupShift >= 0 && safeGroupShift <= 3) {
            setGroupShift(safeGroupShift);
        }

        const safeSubGroupIdx = Number(initialScenario.subGroupIdx);
        if (tipo === 'B' && Number.isFinite(safeSubGroupIdx) && safeSubGroupIdx >= 0 && safeSubGroupIdx <= 5) {
            setSubGroupIdx(safeSubGroupIdx);
        } else {
            setSubGroupIdx(0);
        }

        const vacIdNum = Number(initialScenario.vacationRowId);
        if (Number.isFinite(vacIdNum) && vacIdNum > 0) {
            setEnableVacations(true);
            setVacationRowId(String(vacIdNum));
            const vacRow = VACATION_DATA.find(v => v.id === vacIdNum);
            const safePfaIdx = Number(initialScenario.pfaIdx);
            const maxPfa = vacRow ? Math.max(0, vacRow.pfa.length - 1) : 0;
            const nextPfaIdx = Number.isFinite(safePfaIdx) ? Math.min(maxPfa, Math.max(0, safePfaIdx)) : 0;
            setPfaIdx(nextPfaIdx);
        } else {
            setEnableVacations(false);
            setVacationRowId("");
            setPfaIdx(0);
        }

        if (initialScenario.rmStatus === 'dentro' || initialScenario.rmStatus === 'fuera') {
            setRmStatus(initialScenario.rmStatus);
        }

        setSelectedDays([]);
        setSelectedPAPDays([]);
        setSelectedCycleC(null);
        setIsConfirmed(false);
        setPapModeEnabled(false);

        appliedScenarioTokenRef.current = appliedToken;
        if (typeof onInitialScenarioApplied === 'function' && initialScenario.token) {
            onInitialScenarioApplied(initialScenario.token);
        }
    }, [initialScenario, tipo, onInitialScenarioApplied]);

    const monthsToRender = tipo === 'A' ? Array.from({ length: 11 }, (_, i) => i + 1) : Array.from({ length: 12 }, (_, i) => i);
    const selectedDaysSet = useMemo(() => new Set(selectedDays), [selectedDays]);
    const selectedPAPDaysSet = useMemo(() => new Set(selectedPAPDays), [selectedPAPDays]);
    const papLimit = Math.max(0, Math.round(Number(config.maxPAPGlobal ?? 11)));
    const papViewEnabled = tipo === 'C' ? true : papModeEnabled;
    const annualTargets = useMemo(() => getAnnualTargets(rmStatus), [rmStatus]);
    const getBaseQuotaA = useCallback((m, d, esSD, esF) => {
        if (tipo === 'A' && m === 0) return 0;
        return getBaseQuota(config, m, d, esSD, esF) || 0;
    }, [tipo, config]);
    const selectedVacationRow = useMemo(() => {
        const id = Number(vacationRowId);
        if (!id) return null;
        return VACATION_DATA.find(v => v.id === id) || null;
    }, [vacationRowId]);
    const selectedPfaOption = useMemo(() => {
        if (!selectedVacationRow) return null;
        return selectedVacationRow.pfa[pfaIdx] || selectedVacationRow.pfa[0] || null;
    }, [selectedVacationRow, pfaIdx]);
    const selectedRMDate = useMemo(() => {
        if (!enableVacations || !selectedVacationRow || !selectedPfaOption) return null;
        return getAdjustedRmDateForScenario(year, selectedVacationRow, selectedPfaOption, groupShift, isRestForGroup);
    }, [year, enableVacations, selectedVacationRow, selectedPfaOption, groupShift, isRestForGroup]);
    const selectedRMDayId = useMemo(() => {
        if (!selectedRMDate) return null;
        return `${selectedRMDate.getMonth()}-${selectedRMDate.getDate()}`;
    }, [selectedRMDate]);

    const isRestForGroup = useCallback((date, gShift) => {
        const dow = date.getDay();
        const diff = dow === 0 ? 6 : dow - 1;
        const mon = new Date(date); mon.setDate(date.getDate() - diff); mon.setHours(0,0,0,0);
        const wb = Math.round((mon - ANCHOR_MONDAY) / MS_PER_WEEK);
        let si = (wb - gShift) % 4; if (si < 0) si += 4;
        return SEQUENCE[si].includes(dow);
    }, []);

    const getAdjustedPfaRange = useCallback((pfaOpt, targetGroupShift) => {
        const originalStart = new Date(year, pfaOpt.start.m, pfaOpt.start.d);
        let actualStart = new Date(originalStart);
        const originalEnd = new Date(year, pfaOpt.end.m, pfaOpt.end.d);
        const durationMs = originalEnd.getTime() - originalStart.getTime();
        const isDecemberPfa11To31 = pfaOpt.start.m === 11 && pfaOpt.start.d === 11;
        let safety = 0;
        while (isRestForGroup(actualStart, targetGroupShift) && safety < 10) {
            actualStart.setDate(actualStart.getDate() + (isDecemberPfa11To31 ? -1 : 1));
            safety++;
        }
        const pfaStart = actualStart.getTime();
        let pfaEnd = pfaStart + durationMs;
        if (isDecemberPfa11To31 && actualStart.getTime() < originalStart.getTime()) {
            pfaEnd = originalEnd.getTime();
        }
        return { pfaStart, pfaEnd };
    }, [year, isRestForGroup]);

    const annualVacationRanges = useMemo(() => {
        if (!enableVacations || !selectedVacationRow || !selectedPfaOption) return null;
        const pfaRange = getAdjustedPfaRange(selectedPfaOption, groupShift);
        return {
            summerStart: new Date(year, selectedVacationRow.summer.start.m, selectedVacationRow.summer.start.d).getTime(),
            summerEnd: new Date(year, selectedVacationRow.summer.end.m, selectedVacationRow.summer.end.d).getTime(),
            pfaStart: pfaRange.pfaStart,
            pfaEnd: pfaRange.pfaEnd
        };
    }, [enableVacations, selectedVacationRow, selectedPfaOption, getAdjustedPfaRange, groupShift, year]);

    const mtePrecedenteTotal = useMemo(() => {
        const safeTotal = config.globalMTE || 2100;
        const mtePerBlock = safeTotal / 13;
        return ((block - 1) * mtePerBlock) + (subBlockIdx * (mtePerBlock / 12));
    }, [block, subBlockIdx, config.globalMTE]);

    const mtePorGrupo = useMemo(() => mtePrecedenteTotal / 4, [mtePrecedenteTotal]);

    const mtePersonas = useMemo(() => {
        const list = []; let idCounter = 0;
        const safeGroupBase = (config.globalMTE || 2100) / 4;
        VACATION_DATA.forEach(row => {
            const summerStart = new Date(year, row.summer.start.m, row.summer.start.d).getTime();
            const summerEnd = new Date(year, row.summer.end.m, row.summer.end.d).getTime();
            row.pfa.forEach(pfa => {
                for(let g = 0; g < 4; g++) { 
                    const pfaRange = getAdjustedPfaRange(pfa, g);
                    const rmDate = getAdjustedRmDateForScenario(year, row, pfa, g, isRestForGroup);
                    list.push({
                        id: idCounter++, group: g, parentId: row.id, parentLabel: row.label,
                        cohortMTE: safeGroupBase * pfa.weight, 
                        summerStart, summerEnd,
                        pfaStart: pfaRange.pfaStart, pfaEnd: pfaRange.pfaEnd,
                        rmDayId: rmDate ? `${rmDate.getMonth()}-${rmDate.getDate()}` : null
                    });
                }
            });
        });
        return list;
    }, [year, getAdjustedPfaRange, isRestForGroup, config.globalMTE]);

    /**
     * OPTIMIZACIÓN (sin variar lógica): indexar personas por grupo para no filtrar continuamente.
     */
    const mtePersonasPorGrupo = useMemo(() => {
        const map = new Map();
        for (let g = 0; g < 4; g++) map.set(g, []);
        for (const p of mtePersonas) map.get(p.group).push(p);
        return map;
    }, [mtePersonas]);

    const semanaSantaRange = useMemo(() => {
        const easter = getEasterDate(year);
        const start = new Date(easter);
        start.setDate(easter.getDate() - 7);
        start.setHours(0, 0, 0, 0);
        const end = new Date(easter);
        end.setHours(23, 59, 59, 999);
        return { start: start.getTime(), end: end.getTime() };
    }, [year]);

    const festivosDelAno = useMemo(() => {
        const fixed = ["0-1", "0-6", "4-1", "4-2", "4-15", "7-15", "9-12", "10-1", "10-9", "11-6", "11-8", "11-25"];
        const easter = getEasterDate(year);
        const juevesSanto = new Date(easter); juevesSanto.setDate(easter.getDate() - 3);
        const viernesSanto = new Date(easter); viernesSanto.setDate(easter.getDate() - 2);
        return [...fixed, `${juevesSanto.getMonth()}-${juevesSanto.getDate()}`, `${viernesSanto.getMonth()}-${viernesSanto.getDate()}`, ...(config.customHolidays || [])];
    }, [year, config.customHolidays]);
    const festivosSet = useMemo(() => new Set(festivosDelAno), [festivosDelAno]);
    const isHolidayDateA = useCallback((date) => {
        return date.getFullYear() === year && festivosSet.has(`${date.getMonth()}-${date.getDate()}`);
    }, [year, festivosSet]);
    const isBridgeDayA = useCallback((date) => {
        const dow = date.getDay();
        if (dow === 0 || dow === 6 || isHolidayDateA(date)) return false;

        const prev = new Date(date); prev.setDate(date.getDate() - 1); prev.setHours(0, 0, 0, 0);
        const next = new Date(date); next.setDate(date.getDate() + 1); next.setHours(0, 0, 0, 0);
        const betweenTwoHolidays = isHolidayDateA(prev) && isHolidayDateA(next);

        const mondayOffset = dow === 0 ? 6 : dow - 1;
        const monday = new Date(date); monday.setDate(date.getDate() - mondayOffset); monday.setHours(0, 0, 0, 0);
        const friday = new Date(monday); friday.setDate(monday.getDate() + 4); friday.setHours(0, 0, 0, 0);
        const sameWeekLongWeekend = isHolidayDateA(monday) || isHolidayDateA(friday);

        return betweenTwoHolidays || sameWeekLongWeekend;
    }, [isHolidayDateA]);

    const getFactorPresionA = useCallback((m, d, esSD, esF) => {
        const date = new Date(year, m, d);
        const t = date.getTime();
        const isSummerCore = (m === 6 || m === 7);
        const isSummerShoulder = (m === 5 && d >= 15) || (m === 8 && d <= 15);
        const isWinter = (m === 11 && d >= 20);
        const isSemanaSanta = (t >= semanaSantaRange.start && t <= semanaSantaRange.end);
        let factor = config.presionLab;

        if (isSummerCore) factor = esSD ? config.presionAltaSD : config.presionAltaLab;
        else if (isSummerShoulder) factor = esSD ? (config.presionAltaSD - 5) : config.presionAltaLab;
        else if (isSemanaSanta) factor = config.presionSemanaSanta;
        else if (isWinter) factor = esSD ? config.presionInviernoSD : config.presionInviernoLab;
        else if (esF) factor = config.presionFes;
        else if (esSD) factor = config.presionSD;

        if (!esSD && !esF) {
            if (isBridgeDayA(date)) factor = Math.max(factor, Number(config.presionPuentes) || 0);
            if (date.getDay() === 5) factor = Math.max(factor, Number(config.presionViernes) || 0);
            if (date.getDay() === 2) factor = Math.max(factor, Number(config.presionMartes) || 0);
        }
        return factor;
    }, [year, semanaSantaRange, config, isBridgeDayA]);

    const getMteDayBreakdown = useCallback((date) => {
        const t = date.getTime();
        let mteActivo = 0;
        let mteDescanso = 0;
        let mteVacPfa = 0;
        const safeGroupBase = (config.globalMTE || 2100) / 4;

        for (let g = 0; g < 4; g++) {
            if (isRestForGroup(date, g)) {
                mteDescanso += mtePorGrupo;
                continue;
            }
            let ausentesInGroup = 0;
            const grupoList = mtePersonasPorGrupo.get(g) || [];
            grupoList.forEach(p => {
                if ((t >= p.summerStart && t <= p.summerEnd) || (t >= p.pfaStart && t <= p.pfaEnd)) {
                    ausentesInGroup += (p.cohortMTE * (mtePorGrupo / safeGroupBase));
                }
            });
            const vacPfaInGroup = Math.min(mtePorGrupo, Math.max(0, ausentesInGroup));
            mteVacPfa += vacPfaInGroup;
            mteActivo += Math.max(0, mtePorGrupo - vacPfaInGroup);
        }

        return {
            active: Math.max(0, mteActivo),
            rest: Math.max(0, mteDescanso),
            vacation: Math.max(0, mteVacPfa)
        };
    }, [config.globalMTE, isRestForGroup, mtePersonasPorGrupo, mtePorGrupo]);

    const getActiveMteForDate = useCallback((date) => getMteDayBreakdown(date).active, [getMteDayBreakdown]);
    const getAutoPriorityForMonthA = useCallback((monthIdx) => getAutoPriorityMultiplierA(config, monthIdx), [config]);

    const autoAssignmentA = useMemo(() => {
        const emptyBreakdown = {
            lab: { total: 0, remaining: 0, consumed: 0 },
            sd: { total: 0, remaining: 0, consumed: 0 },
            fes: { total: 0, remaining: 0, consumed: 0 }
        };
        if (tipo !== 'A') return { total: 0, remaining: 0, consumed: 0, byType: emptyBreakdown, byDay: new Map() };

        const dayRows = [];
        const byType = {
            lab: { total: 0, remaining: 0, consumed: 0 },
            sd: { total: 0, remaining: 0, consumed: 0 },
            fes: { total: 0, remaining: 0, consumed: 0 }
        };
        let total = 0;

        for (let m = 0; m < 12; m++) {
            const daysInMonth = new Date(year, m + 1, 0).getDate();
            for (let d = 1; d <= daysInMonth; d++) {
                const date = new Date(year, m, d);
                const esSD = date.getDay() === 0 || date.getDay() === 6;
                const esF = festivosSet.has(`${m}-${d}`);
                const dayId = `${m}-${d}`;
                const base = getBaseQuotaA(m, d, esSD, esF);
                const factor = getFactorPresionA(m, d, esSD, esF);
                const priority = factor * getAutoPriorityForMonthA(m);
                const typeKey = esF ? 'fes' : (esSD ? 'sd' : 'lab');
                const activeMte = getActiveMteForDate(date);
                const maxAuto = Math.max(0, Math.min(base, Math.floor(activeMte)));

                dayRows.push({ dayId, month: m, typeKey, base, priority, maxAuto, consumed: 0 });
                byType[typeKey].total += base;
                total += base;
            }
        }

        const allocateDemand = (filterFn, demand) => {
            let left = Math.max(0, Math.round(demand));
            const candidates = dayRows.filter(filterFn);
            const grouped = new Map();
            for (const row of candidates) {
                const key = row.priority.toFixed(6);
                if (!grouped.has(key)) grouped.set(key, []);
                grouped.get(key).push(row);
            }

            const sortedKeys = Array.from(grouped.keys()).sort((a, b) => Number(b) - Number(a));
            for (const key of sortedKeys) {
                if (left <= 0) break;
                const rows = grouped.get(key) || [];
                const rooms = rows.map(r => Math.max(0, r.maxAuto - r.consumed));
                const totalRoom = rooms.reduce((sum, n) => sum + n, 0);
                if (totalRoom <= 0) continue;

                if (left >= totalRoom) {
                    rows.forEach((r, idx) => { r.consumed += rooms[idx]; });
                    left -= totalRoom;
                    continue;
                }

                const provisional = rows.map((r, idx) => {
                    const room = rooms[idx];
                    const exact = (room * left) / totalRoom;
                    const take = Math.min(room, Math.floor(exact));
                    return { r, room, take, remainder: exact - take };
                });

                let assigned = provisional.reduce((sum, p) => sum + p.take, 0);
                let pending = Math.max(0, left - assigned);
                provisional
                    .filter(p => p.room > p.take)
                    .sort((a, b) => b.remainder - a.remainder || b.room - a.room)
                    .forEach(p => {
                        if (pending <= 0) return;
                        p.take += 1;
                        pending -= 1;
                    });

                provisional.forEach(p => { p.r.consumed += p.take; });
                left = 0;
            }
            return left;
        };

        const mteUnits = Math.max(0, Math.round(mtePrecedenteTotal));
        const autoCreditsPerMTE = Math.max(0, Math.round(Number(config.creditosAutoA ?? DEFAULT_FLEX_DAYS_A)));
        const demandLab = mteUnits * REQUIRED_LAB_DAYS_A;
        const demandFlex = mteUnits * autoCreditsPerMTE;
        const pendingLab = allocateDemand(row => row.typeKey === 'lab', demandLab);
        const _pendingFlex = allocateDemand(() => true, demandFlex + pendingLab);

        const byDay = new Map();
        for (const row of dayRows) {
            byDay.set(row.dayId, row.consumed);
            byType[row.typeKey].consumed += row.consumed;
        }

        byType.lab.remaining = Math.max(0, byType.lab.total - byType.lab.consumed);
        byType.sd.remaining = Math.max(0, byType.sd.total - byType.sd.consumed);
        byType.fes.remaining = Math.max(0, byType.fes.total - byType.fes.consumed);

        const byMonth = Array.from({ length: 12 }, (_, idx) => ({
            mes: MESES[idx],
            total: 0,
            consumed: 0,
            remaining: 0
        }));
        for (const row of dayRows) {
            byMonth[row.month].total += row.base;
            byMonth[row.month].consumed += row.consumed;
        }
        byMonth.forEach(m => {
            m.remaining = Math.max(0, m.total - m.consumed);
        });

        const consumed = byType.lab.consumed + byType.sd.consumed + byType.fes.consumed;
        const remaining = Math.max(0, total - consumed);
        return { total, remaining, consumed, byType, byDay, byMonth, mteUnits, autoCreditsPerMTE, demandLab, demandFlex, pendingLab, pendingFlex: _pendingFlex };
    }, [tipo, year, festivosSet, config, getFactorPresionA, getActiveMteForDate, mtePrecedenteTotal, getBaseQuotaA, getAutoPriorityForMonthA]);

    const getCupoPAP = useCallback((m, d, dayOfWeek) => {
        let temporada = 'invierno';
        if (m === 5 && d > 15) temporada = 'junioQ2';
        else if (m === 6) temporada = 'julio';
        else if (m === 7) temporada = 'agosto';
        else if (m === 8) temporada = 'septiembre';

        const tipoDia = dayOfWeek === 6 ? 'sab' : (dayOfWeek === 0 ? 'dom' : 'lab');
        const key = PAP_CONFIG_KEYS[temporada]?.[tipoDia];
        const configured = key ? Number(config[key]) : NaN;
        if (Number.isFinite(configured) && configured >= 0) return configured;
        return CUPOS_PAP[temporada][tipoDia];
    }, [config]);

    const getCupoForDay = useCallback((m, d, esSD, esF) => {
        if (tipo === 'B' || tipo === 'C') return 100;
        const dayId = `${m}-${d}`;
        const base = getBaseQuotaA(m, d, esSD, esF);
        const autoConsumed = autoAssignmentA.byDay.get(dayId) || 0;
        let final = base - autoConsumed;
        if (selectedDaysSet.has(`${m}-${d}`)) final -= 1;
        return Math.max(0, final);
    }, [autoAssignmentA, selectedDaysSet, getBaseQuotaA, tipo]);

    const logicaPrecedentesA = useMemo(() => {
        if (tipo !== 'A') return [];
        return Array.from({ length: 12 }, (_, m) => {
            const refDate = new Date(year, m, 15);
            const mteActivo = getActiveMteForDate(refDate);
            let fpLab = getFactorPresionA(m, 15, false, false);
            let fpSD = getFactorPresionA(m, 15, true, false);
            let fpFes = getFactorPresionA(m, 15, false, true);

            let mult = getAutoPriorityForMonthA(m);
            return { mes: MESES[m], activos: Math.round(mteActivo), ausentes: Math.round(mtePrecedenteTotal - mteActivo), consLab: Math.floor((mteActivo * fpLab * mult) / 100), consSD: Math.floor((mteActivo * fpSD * mult) / 100), consFes: Math.floor((mteActivo * fpFes * mult) / 100) };
        });
    }, [year, mtePrecedenteTotal, tipo, config, getFactorPresionA, getActiveMteForDate, getAutoPriorityForMonthA]);

    const vacationImpactA = useMemo(() => {
        const empty = {
            july: { vacPct: 0, restPct: 0, activePct: 0 },
            august: { vacPct: 0, restPct: 0, activePct: 0 },
            annual: { vacPct: 0, restPct: 0, activePct: 0 }
        };
        if (tipo !== 'A' || mtePrecedenteTotal <= 0) return empty;

        const perMonth = Array.from({ length: 12 }, () => ({ vacPct: 0, restPct: 0, activePct: 0, days: 0 }));
        for (let m = 0; m < 12; m++) {
            const daysInMonth = new Date(year, m + 1, 0).getDate();
            for (let d = 1; d <= daysInMonth; d++) {
                const breakdown = getMteDayBreakdown(new Date(year, m, d));
                perMonth[m].vacPct += (breakdown.vacation * 100) / mtePrecedenteTotal;
                perMonth[m].restPct += (breakdown.rest * 100) / mtePrecedenteTotal;
                perMonth[m].activePct += (breakdown.active * 100) / mtePrecedenteTotal;
                perMonth[m].days += 1;
            }
        }

        const normalized = perMonth.map(m => {
            const div = Math.max(1, m.days);
            return {
                vacPct: m.vacPct / div,
                restPct: m.restPct / div,
                activePct: m.activePct / div
            };
        });

        const annual = normalized.reduce((acc, m) => ({
            vacPct: acc.vacPct + m.vacPct,
            restPct: acc.restPct + m.restPct,
            activePct: acc.activePct + m.activePct
        }), { vacPct: 0, restPct: 0, activePct: 0 });

        return {
            july: normalized[6],
            august: normalized[7],
            annual: {
                vacPct: annual.vacPct / 12,
                restPct: annual.restPct / 12,
                activePct: annual.activePct / 12
            }
        };
    }, [tipo, year, mtePrecedenteTotal, getMteDayBreakdown]);

    const fragmentsC = useMemo(() => {
        if (tipo !== 'C') return [];
        const safeGroupBase = (config.globalMTE || 2100) / 4;
        return mtePersonas
            .filter(p => p.group === groupShift)
            .map((p, idx) => ({
                id: `${p.parentId}-${idx}`,
                remainingMTE: p.cohortMTE * (mtePorGrupo / safeGroupBase),
                summerStart: p.summerStart,
                summerEnd: p.summerEnd,
                pfaStart: p.pfaStart,
                pfaEnd: p.pfaEnd
            }))
            .filter(p => p.remainingMTE > 0.1);
    }, [tipo, config.globalMTE, mtePersonas, groupShift, mtePorGrupo]);

    const cyclesC = useMemo(() => {
        if (tipo !== 'C') return [];
        const rawList = [];
        let current = new Date(year, 0, 1); current.setDate(current.getDate() + (current.getDay() === 0 ? 1 : (8 - current.getDay()) % 7));
        while (current.getFullYear() <= year) {
            const weeksBetween = Math.round((current - ANCHOR_MONDAY) / MS_PER_WEEK);
            let seqIdx = (weeksBetween - groupShift) % 4; if (seqIdx < 0) seqIdx += 4;
            if (seqIdx === 0) { 
                const start = new Date(current); const end = new Date(current); end.setDate(start.getDate() + 14); 
                rawList.push({ id: start.getTime(), start, end, weight: config[`pesoC_${start.getMonth()}`] || 10, allocated: 0 });
            }
            current.setDate(current.getDate() + 7);
        }

        const CYCLE_CAPACITY = Math.max(1, Math.round((config.globalMTE || 2100) / 52)); 
        let workList = rawList.map(c => ({...c}));
        let personasWork = fragmentsC.map(f => ({ ...f }));
        
        let safetyLoop = 0; let movedAny = true;
        while (movedAny && safetyLoop < 100) {
            safetyLoop++; movedAny = false;
            for (let p of personasWork) {
                if (p.remainingMTE < 0.1) continue;
                const availableCycles = workList.filter(c => {
                    if (c.allocated >= CYCLE_CAPACITY) return false;
                    let overlap = 0;
                    for (let t = c.start.getTime(); t <= c.end.getTime(); t += MS_PER_DAY) {
                        let inVacation = false;
                        if (t >= p.summerStart && t <= p.summerEnd) inVacation = true;
                        else if (t >= p.pfaStart && t <= p.pfaEnd) inVacation = true;
                        if(inVacation) overlap++;
                    }
                    return overlap <= (config.maxSolapamiento || 3); 
                });
                if (availableCycles.length === 0) continue; 
                const totalWeight = availableCycles.reduce((sum, c) => sum + c.weight, 0);
                let overflowMTE = 0;
                availableCycles.forEach(c => {
                    const share = (c.weight / totalWeight) * p.remainingMTE;
                    const spaceAvailable = CYCLE_CAPACITY - c.allocated;
                    if (share > spaceAvailable) { c.allocated += spaceAvailable; overflowMTE += (share - spaceAvailable); } 
                    else { c.allocated += share; }
                    if (share > 0.01) movedAny = true; 
                });
                p.remainingMTE = overflowMTE;
            }
        }

        const getVacationRangesUser = () => {
            if (!enableVacations || !selectedVacationRow) return null;
            const row = selectedVacationRow;
            const pfaOpt = row.pfa[pfaIdx] || row.pfa[0];
            const pfaRange = getAdjustedPfaRange(pfaOpt, groupShift);
            return { summerStart: new Date(year, row.summer.start.m, row.summer.start.d).getTime(), summerEnd: new Date(year, row.summer.end.m, row.summer.end.d).getTime(), pfaStart: pfaRange.pfaStart, pfaEnd: pfaRange.pfaEnd };
        };
        const userVac = getVacationRangesUser();

        return workList.map(cycle => {
            const occupationPercent = (cycle.allocated / CYCLE_CAPACITY) * 100;
            const remainingCupo = Math.max(0, Math.round(CYCLE_CAPACITY - cycle.allocated));
            const isBlocked = remainingCupo === 0; 
            let isIncompatible = false; let overlapCount = 0;
            if (userVac) {
                for (let t = cycle.start.getTime(); t <= cycle.end.getTime(); t += MS_PER_DAY) { if ((t >= userVac.summerStart && t <= userVac.summerEnd) || (t >= userVac.pfaStart && t <= userVac.pfaEnd)) overlapCount++; }
                if (overlapCount > (config.maxSolapamiento || 3)) isIncompatible = true;
            }
            let availabilityLevel = isBlocked ? 'blocked' : (isIncompatible ? 'incompatible' : (occupationPercent >= 80 ? 'low' : (occupationPercent >= 50 ? 'medium' : 'high')));
            return { ...cycle, isBlocked, isIncompatible, overlapCount, occupationPercent, remainingCupo, availabilityLevel, cycleCapacity: CYCLE_CAPACITY };
        }).sort((a, b) => a.start - b.start);
    }, [year, groupShift, tipo, fragmentsC, enableVacations, selectedVacationRow, pfaIdx, config, getAdjustedPfaRange]);

    const diagnosticoC = useMemo(() => {
        const emptyMonth = { incompatiblePct: 0, occupied: 0, capacity: 0, occupationPct: 0 };
        if (tipo !== 'C') return { byMonth: Array.from({ length: 12 }, () => ({ ...emptyMonth })), julAgoSep: [emptyMonth, emptyMonth, emptyMonth] };

        const byMonth = Array.from({ length: 12 }, () => ({ ...emptyMonth }));
        const totalFragmentsMTE = fragmentsC.reduce((sum, f) => sum + f.remainingMTE, 0);

        for (let m = 0; m < 12; m++) {
            const monthCycles = cyclesC.filter(c => c.start.getMonth() === m);
            if (monthCycles.length === 0 || totalFragmentsMTE <= 0) continue;

            let incompatibleMTE = 0;
            for (const f of fragmentsC) {
                let hasCompatibleCycle = false;
                for (const c of monthCycles) {
                    let overlap = 0;
                    for (let t = c.start.getTime(); t <= c.end.getTime(); t += MS_PER_DAY) {
                        if ((t >= f.summerStart && t <= f.summerEnd) || (t >= f.pfaStart && t <= f.pfaEnd)) overlap++;
                    }
                    if (overlap <= (config.maxSolapamiento || 3)) {
                        hasCompatibleCycle = true;
                        break;
                    }
                }
                if (!hasCompatibleCycle) incompatibleMTE += f.remainingMTE;
            }

            const occupied = monthCycles.reduce((sum, c) => sum + c.allocated, 0);
            const capacity = monthCycles.reduce((sum, c) => sum + c.cycleCapacity, 0);
            byMonth[m] = {
                incompatiblePct: (incompatibleMTE * 100) / totalFragmentsMTE,
                occupied,
                capacity,
                occupationPct: capacity > 0 ? (occupied * 100) / capacity : 0
            };
        }

        return {
            byMonth,
            julAgoSep: [byMonth[6], byMonth[7], byMonth[8]]
        };
    }, [tipo, cyclesC, fragmentsC, config.maxSolapamiento]);

    const logicaPrecedentesC = useMemo(() => {
        if (mtePorGrupo <= 0 || tipo !== 'C') return [];
        const monthWeights = MESES.map((name, idx) => ({ name, weight: config[`pesoC_${idx}`] || 10 })).sort((a, b) => b.weight - a.weight);
        const topPrefsStr = monthWeights.slice(0, 3).map(m => m.name).join(', ');
        return VACATION_DATA.map(row => {
            const personas = Math.round(mtePorGrupo * row.weight);
            if (personas <= 0) return null;
            return { id: row.id, grupo: row.label, personas, solicitan: topPrefsStr, incompatibles: "Solapan > " + config.maxSolapamiento + " días" };
        }).filter(Boolean);
    }, [mtePorGrupo, tipo, config]);

    const redDaysSet = useMemo(() => {
        const reds = new Set(); if (tipo !== 'B') return reds;
        const firstDayOfYear = new Date(year, 0, 1);
        const daysToFirstMonday = firstDayOfYear.getDay() === 1 ? 0 : (firstDayOfYear.getDay() === 0 ? 1 : 8 - firstDayOfYear.getDay());
        const firstMonday = new Date(year, 0, 1 + daysToFirstMonday); firstMonday.setHours(0,0,0,0);
        const posMod = (n, m) => ((n % m) + m) % m;

        for (let w = -4; w <= 56; w++) {
            const currentMonday = new Date(firstMonday); currentMonday.setDate(firstMonday.getDate() + w * 7);
            const weeksBetween = Math.round((currentMonday - ANCHOR_MONDAY) / MS_PER_WEEK);
            const groupWeek = posMod(weeksBetween - groupShift, 24);
            const phase = groupWeek % 4; const cycle = Math.floor(groupWeek / 4); 
            let daysOffset = []; 
            if (phase === 1) { daysOffset = (subGroupIdx === posMod(cycle + 1, 6)) ? [0, 1] : ((subGroupIdx === posMod(cycle + 3, 6)) ? [3, 4] : []); } 
            else if (phase === 2) { daysOffset = (subGroupIdx === posMod(cycle + 5, 6)) ? [2] : []; }
            for (let offset of daysOffset) {
                const targetDate = new Date(currentMonday); targetDate.setDate(currentMonday.getDate() + offset);
                if (targetDate.getFullYear() === year) reds.add(`${targetDate.getMonth()}-${targetDate.getDate()}`);
            }
        }
        return reds;
    }, [year, groupShift, subGroupIdx, tipo]);

    const getVacationStatus = useCallback((date) => {
        if (!enableVacations || !selectedVacationRow) return { isSummer: false, isPfa: false };
        const row = selectedVacationRow;
        const pfaOpt = row.pfa[pfaIdx] || row.pfa[0];
        const sStart = new Date(year, row.summer.start.m, row.summer.start.d).getTime();
        const sEnd = new Date(year, row.summer.end.m, row.summer.end.d).getTime();
        const pfaRange = getAdjustedPfaRange(pfaOpt, groupShift);
        const t = date.getTime();
        return { isSummer: t >= sStart && t <= sEnd, isPfa: t >= pfaRange.pfaStart && t <= pfaRange.pfaEnd };
    }, [year, selectedVacationRow, pfaIdx, enableVacations, groupShift, getAdjustedPfaRange]);

    const getRMStatus = useCallback((date) => {
        if (!selectedRMDayId) return { isRMDay: false, isRMInside: false };
        const dayId = `${date.getMonth()}-${date.getDate()}`;
        const isRMDay = dayId === selectedRMDayId;
        return { isRMDay, isRMInside: isRMDay && rmStatus === 'dentro' };
    }, [selectedRMDayId, rmStatus]);

    const isPAPBlockedForDay = useCallback((m, d) => {
        const dayId = `${m}-${d}`;
        const date = new Date(year, m, d);
        if (date.getFullYear() !== year || date.getMonth() !== m || date.getDate() !== d) return true;
        const isDescansoA = isRestForGroup(date, groupShift);
        const isDescansoB = tipo === 'B' && redDaysSet.has(dayId);
        const isLibranzaA = tipo === 'A' && selectedDaysSet.has(dayId);
        const t = date.getTime();
        const isLibranzaC = tipo === 'C' && selectedCycleC && (t >= selectedCycleC.start && t <= selectedCycleC.end);
        const { isSummer, isPfa } = getVacationStatus(date);
        const isRmInside = rmStatus === 'dentro' && selectedRMDayId === dayId;
        return isDescansoA || isDescansoB || isLibranzaA || isLibranzaC || isSummer || isPfa || isRmInside;
    }, [year, groupShift, tipo, redDaysSet, selectedDaysSet, selectedCycleC, getVacationStatus, isRestForGroup, rmStatus, selectedRMDayId]);

    useEffect(() => {
        setSelectedPAPDays(prev => {
            const next = prev.filter(id => {
                const [m, d] = id.split('-').map(Number);
                if (!Number.isFinite(m) || !Number.isFinite(d)) return false;
                if (isPAPBlockedForDay(m, d)) return false;
                const dayOfWeek = new Date(year, m, d).getDay();
                return getCupoPAP(m, d, dayOfWeek) > 0;
            });
            if (next.length === prev.length && next.every((v, i) => v === prev[i])) return prev;
            return next;
        });
    }, [year, isPAPBlockedForDay, getCupoPAP]);
    useEffect(() => {
        if (tipo !== 'A' || rmStatus !== 'dentro' || !selectedRMDayId) return;
        setSelectedDays(prev => (prev.includes(selectedRMDayId) ? prev.filter(id => id !== selectedRMDayId) : prev));
    }, [tipo, rmStatus, selectedRMDayId]);

    const annualStats = useMemo(() => {
        const stats = computeAnnualBalance({
            year,
            groupShift,
            targetDays: annualTargets.workDays,
            vacationRanges: annualVacationRanges,
            specificRestSet: tipo === 'A' ? selectedDaysSet : (tipo === 'B' ? redDaysSet : null),
            specificCycle: tipo === 'C' ? selectedCycleC : null,
            workRule: 'rest_and_specific_only',
            includeVacationOnWork: true,
            rmDate: selectedRMDate,
            rmInside: rmStatus === 'dentro'
        });
        const restDays = (stats.baseRests || 0) + (stats.extraRests || 0);
        return {
            ...stats,
            restDays,
            targetDays: annualTargets.workDays,
            targetVacOnWorkDays: annualTargets.vacOnWorkDays,
            targetRestDays: annualTargets.restDays
        };
    }, [year, groupShift, annualTargets, annualVacationRanges, tipo, selectedDaysSet, redDaysSet, selectedCycleC, selectedRMDate, rmStatus]);

    const globalQuotas = useMemo(() => {
        const emptyBreakdown = {
            lab: { total: 0, remaining: 0, consumed: 0 },
            sd: { total: 0, remaining: 0, consumed: 0 },
            fes: { total: 0, remaining: 0, consumed: 0 }
        };
        if (tipo === 'B' || tipo === 'C') return { total: 0, remaining: 0, consumed: 0, byType: emptyBreakdown };
        return {
            total: autoAssignmentA.total,
            remaining: autoAssignmentA.remaining,
            consumed: autoAssignmentA.consumed,
            byType: autoAssignmentA.byType
        };
    }, [tipo, autoAssignmentA]);

    const getCounts = useCallback((currentSel) => {
        let rawLab = 0, rawSD = 0, rawFes = 0;
        currentSel.forEach(id => {
            const [m, d] = id.split('-').map(Number);
            const date = new Date(year, m, d);
            const isWeekend = (date.getDay() === 0 || date.getDay() === 6);
            const isFestivo = festivosSet.has(id);
            if (isFestivo) rawFes++;
            else if (isWeekend) rawSD++;
            else rawLab++;
        });
        const lab = Math.min(rawLab, REQUIRED_LAB_DAYS_A);
        const cred = rawSD + rawFes + Math.max(0, rawLab - REQUIRED_LAB_DAYS_A);
        return {
            rawLab, rawSD, rawFes, lab, cred,
            totalSelected: currentSel.length
        };
    }, [year, festivosSet]);

    /**
     * FIX CRÍTICO: currentCounts y allowedCreditsVisual se usaban en UI y no existían.
     * No cambia comportamiento: solo define los valores que ya se necesitaban.
     */
    const allowedCreditsVisual = creditsEnabled ? maxCredits : 0;
    const currentCounts = useMemo(() => getCounts(selectedDays), [selectedDays, getCounts]);

    const handleSelectPeriodC = useCallback((cycleObj) => {
        if (cycleObj.isBlocked) return; 
        if (cycleObj.overlapCount > config.maxSolapamiento) {
            alert(`🚫 OPERACIÓN DENEGADA\n\nSolapa en ${cycleObj.overlapCount} días con tus Vacaciones.\nLímite: ${config.maxSolapamiento} días.`);
            setSelectedCycleC(null);
        } else {
            setSelectedCycleC(cycleObj);
            setSelectedPAPDays(prev => prev.filter(id => {
                const [m, d] = id.split('-').map(Number);
                if (!Number.isFinite(m) || !Number.isFinite(d)) return false;
                const t = new Date(year, m, d).getTime();
                return !(t >= cycleObj.start && t <= cycleObj.end);
            }));
            if (cycleObj.overlapCount > 0) alert(`? ACEPTADO\nTiene un solapamiento de ${cycleObj.overlapCount} días.`);
        }
    }, [config.maxSolapamiento, year]);

    const handleDayClick = useCallback((m, d, esSD, esF, isDescanso, isVacation, isRMInside = false) => {
        if (tipo === 'B' || tipo === 'C' || isConfirmed || isDescanso || isVacation || isRMInside) return; 
        const dayId = `${m}-${d}`;
        const isSelected = selectedDaysSet.has(dayId);
        const allowedCredits = creditsEnabled ? maxCredits : 0;

        if (isSelected) setSelectedDays(prev => prev.filter(id => id !== dayId));
        else {
            const nextSel = [...selectedDays, dayId];
            if (getCounts(nextSel).cred <= allowedCredits) {
                setSelectedDays(nextSel);
                setSelectedPAPDays(prev => prev.filter(id => id !== dayId));
            }
            else alert(`Límite alcanzado. Máximo ${REQUIRED_LAB_DAYS_A} laborables fijos + ${allowedCredits} créditos.`);
        }
    }, [tipo, isConfirmed, selectedDaysSet, creditsEnabled, maxCredits, selectedDays, getCounts]);

    const handlePAPDayClick = useCallback((m, d, dayOfWeek, isBlocked, papCupoBase) => {
        const dayId = `${m}-${d}`;
        if (selectedPAPDaysSet.has(dayId)) {
            setSelectedPAPDays(prev => prev.filter(id => id !== dayId));
            return;
        }
        if (isBlocked) return;
        if ((papCupoBase || 0) <= 0) {
            alert('Sin cupo PAP disponible para ese día.');
            return;
        }
        if (selectedPAPDays.length >= papLimit) {
            alert(`Límite PAP alcanzado. Máximo ${papLimit} días.`);
            return;
        }
        setSelectedPAPDays(prev => [...prev, dayId]);
    }, [selectedPAPDaysSet, selectedPAPDays.length, papLimit]);

    return (
        <div className="flex flex-col lg:flex-row h-auto min-h-screen lg:min-h-0 lg:h-screen w-full p-2 lg:p-3 gap-3 box-border bg-transparent relative z-10 no-print">
            
            {showHelp && (
                <Modal title={`❓ Ayuda: Calendario ${tipo}`} onClose={() => setShowHelp(false)}>
                    <div className="space-y-4 text-gray-700 text-sm">
                        {tipo === 'A' && (
                            <><p>Simula la petición de <b>días sueltos</b>. Calcula la presión estadística que ejerce el MTE activo sobre los cupos reales.</p><div className="bg-green-50 p-4 rounded-xl border border-green-200"><h4 className="font-bold text-green-900 mb-1">🏆 Ventaja Estratégica</h4><p>Te otorga la <b>máxima flexibilidad</b>. Ideal para solicitar puentes o días sueltos si estás en una buena posición.</p></div></>
                        )}
                        {tipo === 'B' && (
                            <><p>Funciona mediante <b>secuencias de bloques fijos</b> en el año (L-M, X, J-V).</p><div className="bg-green-50 p-4 rounded-xl border border-green-200"><h4 className="font-bold text-green-900 mb-1">🏆 Ventaja Estratégica</h4><p><b>Descansos garantizados</b>. No compites por cupo con los demás. Tu descanso cae matemáticamente por tu subgrupo.</p></div></>
                        )}
                        {tipo === 'C' && (
                            <><p>Asignación de <b>periodos de 15 días continuados</b> mediante cascada de preferencias.</p><div className="bg-green-50 p-4 rounded-xl border border-green-200"><h4 className="font-bold text-green-900 mb-1">🏆 Ventaja Estratégica</h4><p><b>Quincenas blindadas.</b> Ideal para organizar vacaciones largas, protegiendo tus días frente al rápido desgaste del Calendario A.</p></div></>
                        )}
                    </div>
                </Modal>
            )}

            {showLogica && tipo === 'A' && (
                <Modal title="Lógica de Consumo Automático (A)" onClose={() => setShowLogica(false)}>
                    <p className="text-sm mb-4 text-gray-700 font-medium">Tienes <span className="font-bold text-blue-700">{Math.round(mtePrecedenteTotal)} personas</span> delante.</p>
                    <div className="bg-blue-50 border border-blue-200 p-3 rounded-xl mb-4 shadow-sm">
                        <ul className="text-xs text-gray-700 list-disc pl-5">
                            <li><b>Disponibilidad diaria:</b> Un MTE no consume en días donde está de vacaciones/PFA o descanso base.</li>
                            <li><b>Reasignación automática:</b> Ese consumo se mueve a otros días disponibles según prioridad.</li>
                            <li><b>Preferencia Dinámica:</b> La prioridad usa Niveles + perfil Auto (A) por tramos configurado en Ajustes.</li>
                            <li><b>Refuerzos finos:</b> Puentes, viernes y martes pueden subir la prioridad de un laborable concreto.</li>
                        </ul>
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs md:text-sm border-collapse">
                            <thead><tr className="bg-gray-100 text-gray-700 uppercase"><th className="p-2 rounded-tl-lg">Mes</th><th className="p-2">Activos</th><th className="p-2 text-red-600">Cupos quitados (Lab)</th><th className="p-2 text-red-600">Cupos quitados (S/D)</th><th className="p-2 text-red-600 rounded-tr-lg">Cupos quitados (Fes)</th></tr></thead>
                            <tbody>
                                {logicaPrecedentesA.map((row, i) => (
                                    <tr key={i} className="border-b border-gray-100 hover:bg-blue-50/50 transition-colors">
                                        <td className="p-2 font-bold text-gray-800">{row.mes}</td>
                                        <td className="p-2 text-blue-700 font-black">{row.activos} <span className="text-[10px] text-gray-400 font-normal">(-{row.ausentes})</span></td>
                                        <td className="p-2 text-red-600 font-bold">-{row.consLab}</td><td className="p-2 text-red-600 font-bold">-{row.consSD}</td><td className="p-2 text-red-600 font-bold">-{row.consFes}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </Modal>
            )}

            {showLogica && tipo === 'C' && (
                <Modal title="Lógica de Asignación en Cascada (C)" maxWidth="max-w-5xl" onClose={() => setShowLogica(false)}>
                    <p className="text-sm mb-4 text-gray-700 font-medium">Cupo máximo: <span className="text-red-600 font-bold">{Math.max(1, Math.round((config.globalMTE||2100) / 52))} personas</span> por periodo. Tienes <span className="font-bold text-blue-700">{Math.round(mtePorGrupo)} personas</span> de tu grupo delante.</p>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="overflow-x-auto border border-gray-200 rounded-xl p-2">
                            <h3 className="text-xs font-bold text-blue-800 uppercase mb-2 ml-1">Precedentes y Prioridades</h3>
                            <table className="w-full text-left text-xs border-collapse">
                                <thead><tr className="bg-gray-100 text-gray-700 uppercase"><th className="p-2 rounded-tl-lg">Grupo Base</th><th className="p-2">Delante</th><th className="p-2 rounded-tr-lg">Top Preferencias</th></tr></thead>
                                <tbody>
                                    {logicaPrecedentesC.length > 0 ? logicaPrecedentesC.map((p, i) => (
                                        <tr key={i} className="border-b border-gray-100 hover:bg-blue-50/50"><td className="p-2 font-bold text-gray-800">{p.grupo}</td><td className="p-2 text-blue-700 font-black">{p.personas}</td><td className="p-2 text-green-700 font-bold">{p.solicitan}</td></tr>
                                    )) : <tr><td colSpan="3" className="p-4 text-center text-gray-500 font-bold">Eres el número 1.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                        <div className="overflow-x-auto border border-gray-200 rounded-xl p-2">
                            <h3 className="text-xs font-bold text-blue-800 uppercase mb-2 ml-1">Ocupación Real tras Simulación</h3>
                            <table className="w-full text-left text-xs border-collapse">
                                <thead><tr className="bg-gray-100 text-gray-700 uppercase"><th className="p-2 rounded-tl-lg">Periodo (15 días)</th><th className="p-2">Ocupadas</th><th className="p-2 rounded-tr-lg">Estado</th></tr></thead>
                                <tbody>
                                    {cyclesC.map((c, i) => (
                                        <tr key={c.id} className="border-b border-gray-100 hover:bg-blue-50/50">
                                            <td className="p-2 font-bold text-gray-800">{c.start.toLocaleDateString('es-ES', {day:'2-digit', month:'short'})} - {c.end.toLocaleDateString('es-ES', {day:'2-digit', month:'short'})}</td>
                                            <td className="p-2 text-red-600 font-bold">{Math.round(c.allocated)} / {c.cycleCapacity}</td>
                                            <td className="p-2">{c.isBlocked ? <span className="bg-red-100 text-red-700 px-2 py-0.5 rounded font-bold text-[9px]">AGOTADO</span> : <span className="bg-green-100 text-green-700 px-2 py-0.5 rounded font-bold text-[9px]">LIBRE</span>}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </Modal>
            )}

            <div className="w-full lg:w-72 flex flex-col panel shrink-0 order-1 lg:order-2 h-auto lg:h-full lg:overflow-hidden">
                <div className="flex-1 lg:overflow-y-auto custom-scroll flex flex-col">
                    <div className="p-4 border-b border-gray-100/50 bg-gray-50/30 shrink-0">
                        <h4 className="font-bold text-gray-800 text-xs mb-3 uppercase tracking-wider">Tu Posición</h4>
                        <div className="flex flex-col gap-3">
                            <div className="flex gap-2">
                                <div className="flex-1"><label className="text-[9px] font-bold text-gray-600 uppercase">Año</label><select className="custom-select shadow-sm" value={year} onChange={e => { setYear(Number(e.target.value)); setSelectedDays([]); setSelectedPAPDays([]); setSelectedCycleC(null); }}>{Array.from({length: 14}, (_, i) => 2026 + i).map(y => <option key={y} value={y}>{y}</option>)}</select></div>
                                <div className="flex-1"><label className="text-[9px] font-bold text-gray-600 uppercase">G. Descanso</label><select className="custom-select shadow-sm" value={groupShift} onChange={e => { setGroupShift(Number(e.target.value)); setSelectedDays([]); setSelectedPAPDays([]); setSelectedCycleC(null); }}><option value="0">G1</option><option value="1">G2</option><option value="2">G3</option><option value="3">G4</option></select></div>
                            </div>
                            {tipo === 'B' && (<div className="flex-1"><label className="text-[9px] font-bold text-red-600 uppercase">Subgrupo</label><select className="custom-select bg-red-50 text-red-700" value={subGroupIdx} onChange={e => { setSubGroupIdx(Number(e.target.value)); setSelectedPAPDays([]); }}>{[1,2,3,4,5,6].map(s => <option key={s} value={s-1}>Subgrupo {s}</option>)}</select></div>)}
                            {(tipo === 'A' || tipo === 'C') && (

    <div>Subbloque {subBlockPos}/3</div>

</div>
